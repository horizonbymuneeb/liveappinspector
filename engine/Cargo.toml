[package]
name = "liveappinspector"
version = "1.0.1"
edition = "2021"
description = "LiveAppInspector - point-and-shoot live application forensics engine (DFIR)"
authors = ["LiveAppInspector Project"]
rust-version = "1.75"

[[bin]]
name = "lai"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1
