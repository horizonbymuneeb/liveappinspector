version: 2
updates:
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The whole runtime surface is tiny; keep it in one reviewable PR.
      runtime:
        patterns: ["serde*", "sha2", "digest*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
